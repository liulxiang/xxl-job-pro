name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '17' ]
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile
        run: mvn -B -ntp -q compile -DskipTests

      - name: Package admin
        run: mvn -B -ntp -q -pl xxl-job-admin -am package -DskipTests

      - name: Upload admin jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: xxl-job-admin
          path: xxl-job-admin/target/xxl-job-admin-*.jar
          if-no-files-found: error
          retention-days: 14

job_help_doc_f_handler=執行器任務 Handler 名稱，glueType=BEAN 時必填
job_help_doc_f_alarm=告警郵件，多個信箱以逗號分隔
job_help_doc_f_misfire=調度過期策略
job_help_doc_f_route=執行器路由策略
job_help_doc_f_param=任務參數
job_help_doc_f_block=阻塞處理策略
job_help_doc_f_timeout=任務逾時時間，單位秒，0 表示不限制
job_help_doc_f_retry=失敗重試次數
job_help_doc_f_child=子任務 ID，多個以逗號分隔
job_help_doc_webhook_desc=觸發時傳入 webhookUrl，或憑證設定了預設 callback_url，任務進入終態後調度中心會主動 POST 執行結果到該位址。
job_help_doc_webhook_payload=回呼內容
job_help_doc_webhook_sign=回呼驗簽
job_help_doc_webhook_sign_desc=回呼請求標頭 Xxl-Job-Callback-Sign 的值為 lowercaseHex(HmacSHA256(appSecret, rawBody))，接收方以同一 AppSecret 對原始 body 重算比對即可確認來源；憑證被停用或刪除時該標頭不攜帶，應將無簽名視為不可信。
job_help_doc_webhook_retry=可靠性與冪等
job_help_doc_webhook_retry_desc=任務完成即投遞，HTTP 2xx 視為成功；失敗或未投遞成功的記錄由後台補償執行緒定時掃描重投，最多 5 次，超限則標記為已放棄。接收方仍應依 logId 保證冪等。
job_help_doc_example_java=Java（內建 SDK）
job_help_doc_example_python=Python
job_help_doc_example_java_desc=依賴 xxl-job-core 後，簽名、時間戳與 nonce 全部由 SDK 處理。
job_help_doc_err_auth=缺請求標頭、時間戳過期、簽名不符、nonce 重複與憑證停用
job_help_doc_err_auth_r=HTTP 401，msg 為具體原因
job_help_doc_err_perm=越權操作未授權的執行器組
job_help_doc_err_perm_r=code 非 200，msg 含 permission limit
job_help_doc_err_notfound=任務或日誌不存在
job_help_doc_err_notfound_r=code 非 200，msg 含 not found
job_help_doc_err_trigger=觸發失敗未產生調度日誌
job_help_doc_err_trigger_r=code 非 200，msg 為 trigger fail
job_help_doc_err_nonce=nonce 防重放基於單機記憶體快取；多節點部署時同一 nonce 在極短視窗內理論上可能被不同節點各放行一次，生產建議搭配 HTTPS 並收斂時間戳視窗。
job_help_doc_err_secret=AppSecret 在憑證清單頁遮蔽顯示，明文僅在建立時可見，請妥善保管。


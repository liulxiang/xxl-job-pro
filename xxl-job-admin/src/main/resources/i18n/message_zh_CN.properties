job_help_doc_webhook_payload=回调负载
job_help_doc_webhook_sign=回调验签
job_help_doc_webhook_sign_desc=回调请求头 Xxl-Job-Callback-Sign 的值为 lowercaseHex(HmacSHA256(appSecret, rawBody))，接收方用同一 AppSecret 对原始 body 重算比对即可确认来源；凭证被禁用或删除时该头不携带，应将无签名视为不可信。
job_help_doc_webhook_retry=可靠性与幂等
job_help_doc_webhook_retry_desc=任务完成即投递，HTTP 2xx 视为成功；失败或未投递成功的记录由后台补偿线程定时扫描重投，最多 5 次，超限置为已放弃。接收方仍应按 logId 保证幂等。
job_help_doc_example_java=Java（内置 SDK）
job_help_doc_example_python=Python
job_help_doc_example_java_desc=依赖 xxl-job-core 后，签名、时间戳与 nonce 全部由 SDK 处理。
job_help_doc_err_auth=缺请求头、时间戳过期、签名不符、nonce 重复与凭证禁用
job_help_doc_err_auth_r=HTTP 401，msg 为具体原因
job_help_doc_err_perm=越权操作未授权的执行器组
job_help_doc_err_perm_r=code 非 200，msg 含 permission limit
job_help_doc_err_notfound=任务或日志不存在
job_help_doc_err_notfound_r=code 非 200，msg 含 not found
job_help_doc_err_trigger=触发失败未生成调度日志
job_help_doc_err_trigger_r=code 非 200，msg 为 trigger fail
job_help_doc_err_nonce=nonce 防重放基于单机内存缓存；多节点部署时同一 nonce 在极短窗口内理论上可能被不同节点各放行一次，生产建议配合 HTTPS 并收敛时间戳窗口。
job_help_doc_err_secret=AppSecret 在凭证列表页脱敏展示，明文仅在创建时可见，请妥善保管。
job_help_doc_webhook_desc=Pass webhookUrl when triggering, or configure the credential callback_url; once the job reaches a final state the scheduler POSTs the result to that URL.
job_help_doc_webhook_payload=Callback payload
job_help_doc_webhook_sign=Callback signature
job_help_doc_webhook_sign_desc=The Xxl-Job-Callback-Sign header equals lowercaseHex(HmacSHA256(appSecret, rawBody)). Recompute it with the same AppSecret over the raw body to verify the origin. The header is omitted when the credential is disabled or removed, so treat a missing signature as untrusted.
job_help_doc_webhook_retry=Reliability and idempotency
job_help_doc_webhook_retry_desc=Delivery is attempted as soon as the job finishes and HTTP 2xx means success; failed records are scanned and retried by a background thread up to 5 times, then marked as abandoned. Receivers should still deduplicate by logId.
job_help_doc_example_java=Java (built-in SDK)
job_help_doc_example_python=Python
job_help_doc_example_java_desc=Add the xxl-job-core dependency and the SDK handles signature, timestamp and nonce for you.
job_help_doc_err_auth=Missing headers, expired timestamp, bad signature, reused nonce or disabled credential
job_help_doc_err_auth_r=HTTP 401 with the reason in msg
job_help_doc_err_perm=Operating an executor group out of scope
job_help_doc_err_perm_r=code is not 200, msg contains permission limit
job_help_doc_err_notfound=Job or log not found
job_help_doc_err_notfound_r=code is not 200, msg contains not found
job_help_doc_err_trigger=Trigger failed without generating a log
job_help_doc_err_trigger_r=code is not 200, msg is trigger fail
job_help_doc_err_nonce=Nonce replay protection relies on a single-node memory cache; with a cluster the same nonce may theoretically pass once per node inside a very short window, so HTTPS and a tighter timestamp window are recommended in production.
job_help_doc_err_secret=AppSecret is masked in the credential list and only shown once at creation time, keep it safe.

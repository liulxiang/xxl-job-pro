job_help_doc_step1=Prepare tables
job_help_doc_step1_desc=Make sure the tables xxl_job_api_client and xxl_job_openapi_callback exist in the database.
job_help_doc_step2=Create credential
job_help_doc_step2_desc=An administrator creates a credential on the OpenAPI Client page with AppKey, AppSecret and a bound admin account.
job_help_doc_step3=Sign and call
job_help_doc_step3_desc=Build the auth headers with the algorithm below, then call the endpoints. Integrators can also use the built-in Java SDK instead of signing by hand.
job_help_doc_perm=Permission model
job_help_doc_perm_desc=The bound admin account defines the scope: administrators can operate all executor groups, while normal accounts can only operate jobs inside their authorized groups. Calls out of scope return a permission error.
job_help_doc_endpoints=Endpoint overview
job_help_doc_all_post=All endpoints use POST, URL pattern {baseUrl}/openapi/v1/..., and every response has the shape code / msg / content.

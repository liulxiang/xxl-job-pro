## help / openapi doc
job_help_doc_intro=Machine-to-machine API for third-party systems and heterogeneous projects: create, update, start, stop and delete jobs, trigger executions and query results. Paths and authentication are fully isolated from the internal admin API.
job_help_doc_base_url=Base URL
job_help_doc_auth_mode=Authentication

job_help_doc_col_scene=Scenario
job_help_doc_col_behavior=Behavior
job_help_doc_headers=Request headers
job_help_doc_header_appkey=Assigned AppKey
job_help_doc_header_ts=Millisecond timestamp, must stay inside the allowed window (default plus or minus 5 minutes)
job_help_doc_header_nonce=Random string, UUID without dashes is recommended, must not repeat inside the window
job_help_doc_header_sign=Signature value, see the algorithm below
job_help_doc_str2sign=String to sign
job_help_doc_str2sign_desc=Four segments joined by a newline character; when there is no body rawBody is an empty string; rawBody must byte-match the sent request body exactly, otherwise the signature will not match.
job_help_doc_sign_calc=Signature value
job_help_doc_sign_calc_desc=Output is a 64-character lowercase hex string.
job_help_doc_verify_order=Server verification order
job_help_doc_verify_1=All four headers are present
job_help_doc_verify_2=timestamp is inside the allowed window
job_help_doc_verify_3=An enabled credential is loaded by appKey
job_help_doc_verify_4=Signature is recomputed with appSecret and compared in constant time
job_help_doc_verify_5=nonce has not been used inside the window
job_help_doc_verify_6=Bound account exists, then it is put into the request context
job_help_doc_verify_fail=Any failure returns HTTP 401 with code=401 and a msg describing the reason.
job_help_doc_debugger=Online signature helper
job_help_doc_debugger_tip=Only used to generate auth headers and a cURL sample. The secret is processed locally in this browser and never sent to the server.
